[project]
name = "alma-python-packages"
version = "1.4.10"
description = "Python module for making requests to the Alma API"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
    { name = "Gustav Lindqvist", email = "gustav.lindqvist@ju.se" }
]
dependencies = [
    "httplib2",
    "xmljson",
]

[project.urls]
Homepage = "https://github.com/JonkopingUniversityLibrary/alma-python-packages"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alma_api", "alma_analytics_parser", "alma_marc"]
